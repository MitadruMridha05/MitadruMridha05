<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quote Dojo · Mitadru Mridha</title>
  <meta name="description" content="A small 3D quote dojo inspired by Japanese night landscapes, built by Mitadru Mridha." />
  <style>
    :root { --ink:#f2e9dc; --muted:#aaa7ad; --red:#dc143c; --gold:#d4af37; --panel:rgba(10,10,14,.72); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; overflow:hidden; color:var(--ink); background:#050506; font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif; }
    #scene { position:fixed; inset:0; }
    .grain { position:fixed; inset:0; pointer-events:none; opacity:.10; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E"); mix-blend-mode:screen; }
    .hud { position:fixed; z-index:2; top:clamp(24px,7vw,72px); left:clamp(20px,7vw,100px); width:min(520px,calc(100vw - 40px)); padding:28px 30px 26px; border:1px solid rgba(212,175,55,.38); border-left:4px solid var(--red); background:linear-gradient(135deg,rgba(20,9,13,.88),var(--panel)); box-shadow:0 20px 80px rgba(0,0,0,.4); backdrop-filter:blur(12px); }
    .eyebrow { color:var(--gold); letter-spacing:.22em; font-size:.72rem; text-transform:uppercase; }
    h1 { margin:10px 0 0; font:700 clamp(2rem,5vw,3.6rem)/1.02 Georgia,serif; letter-spacing:.01em; }
    .jp { color:var(--red); font-size:1.1rem; letter-spacing:.22em; margin:12px 0 22px; }
    blockquote { margin:0; min-height:96px; display:flex; align-items:center; font:italic 1.2rem/1.55 Georgia,serif; color:#fffaf3; }
    .attribution { color:var(--muted); min-height:22px; font-size:.82rem; margin-top:12px; }
    button { cursor:pointer; border:0; color:#0a0a0a; background:var(--gold); padding:12px 18px; margin-top:18px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; transition:transform .2s,background .2s; }
    button:hover,button:focus-visible { transform:translateY(-2px); background:#f2cf5a; outline:2px solid var(--ink); outline-offset:3px; }
    .hint { position:fixed; z-index:2; right:28px; bottom:24px; color:rgba(242,233,220,.65); font-size:.75rem; letter-spacing:.1em; text-transform:uppercase; }
    a { color:var(--gold); }
    @media (max-width:650px) { .hud { top:20px; left:20px; padding:22px; } blockquote { font-size:1rem; min-height:110px; } .hint { right:16px; bottom:14px; } }
  </style>
</head>
<body>
  <div id="scene" aria-hidden="true"></div>
  <main class="hud" aria-live="polite">
    <div class="eyebrow">忍道 · The ninja way</div>
    <h1>Quote Dojo</h1>
    <div class="jp">静けさの中で、 sharpen the mind</div>
    <blockquote id="quote">Loading a thought for the journey…</blockquote>
    <div class="attribution" id="source"></div>
    <button id="new-quote" type="button">Draw a new scroll</button>
  </main>
  <div class="hint">Drag to orbit · Scroll to zoom</div>
  <div class="grain"></div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    const quotes = [
      ['The secret of getting ahead is getting started.', 'Mark Twain'],
      ['Great things are done by a series of small things brought together.', 'Vincent van Gogh'],
      ['The best way to predict the future is to build it.', 'Peter Drucker'],
      ['Make it work, make it right, make it fast.', 'Kent Beck'],
      ['A model is only as useful as the decision it improves.', 'Engineering proverb'],
      ['In the middle of difficulty lies opportunity.', 'Albert Einstein'],
      ['Fall seven times, stand up eight.', 'Japanese proverb'],
      ['First solve the problem. Then write the code.', 'John Johnson'],
      ['Small disciplines repeated with consistency lead to great achievements.', 'John C. Maxwell']
    ];
    const quoteEl = document.querySelector('#quote');
    const sourceEl = document.querySelector('#source');
    let last = -1;
    function newQuote() {
      let index;
      do { index = Math.floor(Math.random() * quotes.length); } while (index === last && quotes.length > 1);
      last = index;
      quoteEl.textContent = `“${quotes[index][0]}”`;
      sourceEl.textContent = `— ${quotes[index][1]}`;
    }
    document.querySelector('#new-quote').addEventListener('click', newQuote);
    newQuote();

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x08070a, 0.025);
    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, .1, 100);
    camera.position.set(8, 5.4, 10);
    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.querySelector('#scene').appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.enablePan = false; controls.minDistance = 6; controls.maxDistance = 18; controls.target.set(0, 2.2, 0);
    const ambient = new THREE.HemisphereLight(0x9c7383, 0x08070a, 1.4); scene.add(ambient);
    const moonLight = new THREE.DirectionalLight(0xded4c7, 2.4); moonLight.position.set(-4, 9, 4); moonLight.castShadow = true; scene.add(moonLight);
    const redLight = new THREE.PointLight(0xdc143c, 18, 14); redLight.position.set(0, 4, -3); scene.add(redLight);

    const ground = new THREE.Mesh(new THREE.CircleGeometry(20, 64), new THREE.MeshStandardMaterial({ color:0x09080b, roughness:.95, metalness:.1 }));
    ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
    const moon = new THREE.Mesh(new THREE.SphereGeometry(2.4, 48, 48), new THREE.MeshBasicMaterial({ color:0x9f102e, transparent:true, opacity:.92 })); moon.position.set(-5, 7.2, -8); scene.add(moon);
    const moonGlow = new THREE.Mesh(new THREE.SphereGeometry(3.2, 32, 32), new THREE.MeshBasicMaterial({ color:0xdc143c, transparent:true, opacity:.10, blending:THREE.AdditiveBlending })); moonGlow.position.copy(moon.position); scene.add(moonGlow);

    function box(w,h,d,color,x,y,z,metal=.1) { const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({ color, roughness:.65, metalness:metal })); mesh.position.set(x,y,z); mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh); return mesh; }
    function cone(r,h,color,x,y,z) { const mesh = new THREE.Mesh(new THREE.ConeGeometry(r,h,4), new THREE.MeshStandardMaterial({ color, roughness:.7 })); mesh.position.set(x,y,z); mesh.rotation.y=Math.PI/4; mesh.castShadow=true; scene.add(mesh); return mesh; }
    // A minimal low-poly pagoda silhouette.
    [ [3.8,.8,2.6,1.0], [3.0,.65,2.0,1.8], [2.25,.55,1.5,2.55], [1.55,.5,1.05,3.2] ].forEach(([w,h,d,y]) => { box(w,h,d,0x101015,0,y,0); cone(w*.62,.42,0x17171f,0,y+h/2+.15,0); });
    box(.62,1.2,.62,0x15151b,0,4.15,0); cone(.52,1.1,0x15151b,0,5.3,0);
    // Torii gate framing the dojo.
    [-3.8,3.8].forEach(x => { box(.4,5.3,.4,0x591126,x,2.65,-1.2); box(.62,.38,.62,0xd4af37,x,5.23,-1.2,.75); });
    box(9.2,.42,.5,0x591126,0,5.05,-1.2); box(10.2,.3,.42,0xd4af37,0,5.52,-1.2,.8);
    // Katana in front of the pagoda.
    const katana = new THREE.Group(); katana.position.set(2.1,1.5,2.4); katana.rotation.z=-.46; scene.add(katana);
    const blade = new THREE.Mesh(new THREE.BoxGeometry(.12,4.8,.08), new THREE.MeshStandardMaterial({color:0xe3e5e8,metalness:.9,roughness:.16})); blade.position.y=2.3; katana.add(blade);
    const guard = new THREE.Mesh(new THREE.TorusGeometry(.34,.07,12,24), new THREE.MeshStandardMaterial({color:0xd4af37,metalness:.85})); guard.rotation.x=Math.PI/2; guard.position.y=-.1; katana.add(guard);
    const handle = new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,1.55,12), new THREE.MeshStandardMaterial({color:0x24151a,roughness:.8})); handle.position.y=-.9; katana.add(handle);

    const stars = new THREE.BufferGeometry(); const points=[];
    for(let i=0;i<500;i++) points.push((Math.random()-.5)*30, Math.random()*14+2, (Math.random()-.5)*22-5);
    stars.setAttribute('position',new THREE.Float32BufferAttribute(points,3)); scene.add(new THREE.Points(stars,new THREE.PointsMaterial({color:0xd4af37,size:.025,transparent:true,opacity:.7})));
    const embers = []; for(let i=0;i<30;i++){ const e=new THREE.Mesh(new THREE.SphereGeometry(.025,6,6),new THREE.MeshBasicMaterial({color:0xdc143c})); e.position.set((Math.random()-.5)*12,Math.random()*6+.3,(Math.random()-.5)*8); e.userData.speed=.002+Math.random()*.006; scene.add(e); embers.push(e); }

    const clock = new THREE.Clock();
    function animate(){ requestAnimationFrame(animate); const t=clock.getElapsedTime(); katana.rotation.y=Math.sin(t*.5)*.08; moonGlow.scale.setScalar(1+Math.sin(t*.8)*.04); embers.forEach(e=>{e.position.y+=e.userData.speed;if(e.position.y>7)e.position.y=.3;}); controls.update(); renderer.render(scene,camera); }
    animate();
    addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
  </script>
</body>
</html>
