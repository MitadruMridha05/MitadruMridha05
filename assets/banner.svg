<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" width="1400" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Mitadru Mridha — Machine Learning Engineer</title>
  <desc id="desc">Cinematic warrior artwork with animated crimson energy, scanlines, embers, and a machine learning engineer terminal overlay.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05070c" stop-opacity=".98"/>
      <stop offset=".35" stop-color="#070910" stop-opacity=".84"/>
      <stop offset=".68" stop-color="#150a13" stop-opacity=".32"/>
      <stop offset="1" stop-color="#05070c" stop-opacity=".34"/>
    </linearGradient>
    <linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#05070c" stop-opacity="0"/><stop offset=".72" stop-color="#05070c" stop-opacity=".26"/><stop offset="1" stop-color="#05070c" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#dc143c"/><stop offset=".52" stop-color="#f2e9dc"/><stop offset="1" stop-color="#d4af37"/></linearGradient>
    <radialGradient id="crimsonGlow"><stop stop-color="#ff3158" stop-opacity=".72"/><stop offset="1" stop-color="#dc143c" stop-opacity="0"/></radialGradient>
    <pattern id="scanlines" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 0H6" stroke="#f2e9dc" stroke-opacity=".055"/></pattern>
    <pattern id="microgrid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#d4af37" stroke-opacity=".08"/></pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="textShadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity=".85"/></filter>
    <clipPath id="frame"><rect x="18" y="18" width="1364" height="384" rx="16"/></clipPath>
    <path id="flightPath" d="M-70 365 C300 200 580 460 970 268 S1300 140 1470 35"/>
  </defs>

  <rect width="1400" height="420" fill="#05070c"/>
  <g clip-path="url(#frame)">
    <image href="warrior-banner.png" x="0" y="0" width="1400" height="420" preserveAspectRatio="xMidYMid slice" opacity=".94"/>
    <rect width="1400" height="420" fill="url(#shade)"/>
    <rect width="1400" height="420" fill="url(#bottomShade)"/>
    <rect width="1400" height="420" fill="url(#microgrid)"/>
    <rect width="1400" height="420" fill="url(#scanlines)"/>

    <!-- crimson atmospheric pulse -->
    <ellipse cx="930" cy="112" rx="310" ry="145" fill="url(#crimsonGlow)" opacity=".28">
      <animate attributeName="opacity" values=".18;.45;.18" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="270;330;270" dur="5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- animated energy slash -->
    <g fill="none" filter="url(#softGlow)" opacity=".8">
      <path d="M-80 356 C270 180 560 470 940 270 S1300 120 1480 24" stroke="#dc143c" stroke-width="3" stroke-dasharray="16 26">
        <animate attributeName="stroke-dashoffset" from="0" to="-420" dur="4.5s" repeatCount="indefinite"/>
      </path>
      <path d="M-80 362 C270 186 560 476 940 276 S1300 126 1480 30" stroke="#f2e9dc" stroke-width="1" stroke-dasharray="3 28">
        <animate attributeName="stroke-dashoffset" from="0" to="-310" dur="3.6s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- falling embers -->
    <g fill="#d4af37" filter="url(#softGlow)">
      <circle cx="830" cy="238" r="2"><animate attributeName="cy" values="238;385" dur="3.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="1010" cy="182" r="1.8"><animate attributeName="cy" values="182;360" dur="4.7s" begin=".8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4.7s" begin=".8s" repeatCount="indefinite"/></circle>
      <circle cx="1180" cy="220" r="1.6"><animate attributeName="cy" values="220;392" dur="4.2s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4.2s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="290" r="1.4"><animate attributeName="cy" values="290;410" dur="3.2s" begin=".4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin=".4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- terminal glass panel -->
    <rect x="52" y="54" width="655" height="292" rx="12" fill="#05070c" fill-opacity=".63" stroke="#f2e9dc" stroke-opacity=".18"/>
    <rect x="52" y="54" width="655" height="30" rx="12" fill="#0a0e16" fill-opacity=".82"/>
    <circle cx="76" cy="69" r="5" fill="#dc143c"/><circle cx="94" cy="69" r="5" fill="#d4af37"/><circle cx="112" cy="69" r="5" fill="#62d5d2"/>
    <text x="138" y="74" fill="#aab2bf" font-family="ui-monospace,Consolas,monospace" font-size="12">mitadru@dojo: ~/machine-learning</text>
    <g font-family="ui-monospace,Consolas,monospace" filter="url(#textShadow)">
      <text x="84" y="126" fill="#62d5d2" font-size="16">&gt; whoami</text>
      <text x="84" y="161" fill="#f2e9dc" font-size="31" font-weight="700">Mitadru Mridha</text>
      <text x="86" y="190" fill="#ff4a69" font-size="15" letter-spacing="1.2">機械学習エンジニア志望 · ML ENGINEER</text>
      <text x="84" y="231" fill="#d8dce2" font-size="13">[mission]  turn data into reliable systems</text>
      <text x="84" y="257" fill="#b9c0c9" font-size="13">[stack]    Python · MLflow · DVC · Docker · FastAPI</text>
      <text x="84" y="283" fill="#b9c0c9" font-size="13">[method]   learn → build → deploy → improve</text>
      <text x="84" y="320" fill="#d4af37" font-size="13">status: OPEN TO ML / MLOPS / SWE</text>
      <rect x="84" y="331" width="8" height="14" fill="#dc143c"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
    </g>

    <!-- scan sweep -->
    <rect x="18" y="18" width="4" height="384" fill="#ff3158" opacity=".65" filter="url(#softGlow)"><animate attributeName="x" values="18;1380;18" dur="8s" repeatCount="indefinite"/></rect>
  </g>

  <rect x="18" y="18" width="1364" height="384" rx="16" fill="none" stroke="url(#edge)" stroke-width="2" stroke-opacity=".9"/>
  <g transform="translate(1296 49)"><rect width="58" height="58" rx="5" fill="#dc143c"/><rect x="5" y="5" width="48" height="48" rx="3" fill="none" stroke="#f2e9dc" stroke-opacity=".7"/><text x="29" y="42" text-anchor="middle" fill="#f2e9dc" font-size="32" font-family="serif">侍</text></g>
  <text x="1290" y="380" text-anchor="end" fill="#f2e9dc" fill-opacity=".65" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="2">DATA · MODEL · DEPLOY · IMPROVE</text>
</svg>
