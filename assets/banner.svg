<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 380" role="img" aria-labelledby="title desc">
  <title id="title">Mitadru Mridha — Machine Learning Engineer terminal banner</title>
  <desc id="desc">A dark terminal-inspired banner with an animated scanline, system graph and Japanese red-seal accent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090d"/><stop offset="0.58" stop-color="#0d1118"/><stop offset="1" stop-color="#171017"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#dc143c"/><stop offset="1" stop-color="#d4af37"/></linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#62d5d2"/><stop offset="1" stop-color="#d4af37"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#9aa6b2" stroke-opacity=".08"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="screen"><rect x="48" y="44" width="1304" height="292" rx="10"/></clipPath>
  </defs>

  <rect width="1400" height="380" fill="url(#bg)"/>
  <rect x="48" y="44" width="1304" height="292" rx="10" fill="#080b10" stroke="#303844" stroke-width="2"/>
  <rect x="48" y="44" width="1304" height="34" rx="10" fill="#111720"/>
  <circle cx="75" cy="61" r="6" fill="#dc143c"/><circle cx="96" cy="61" r="6" fill="#d4af37"/><circle cx="117" cy="61" r="6" fill="#62d5d2"/>
  <text x="150" y="66" fill="#8d99a7" font-family="ui-monospace,Consolas,monospace" font-size="14">mitadru@dojo: ~/machine-learning</text>
  <rect x="48" y="78" width="1304" height="258" fill="url(#grid)" clip-path="url(#screen)"/>

  <!-- subtle system graph -->
  <g fill="none" stroke="#62d5d2" stroke-opacity=".34" stroke-width="1.5">
    <path d="M780 255 L930 182 L1048 232 L1176 130 L1284 174"/>
    <path d="M930 182 L936 116 L1048 232 L1104 92"/>
  </g>
  <g fill="#62d5d2" filter="url(#glow)"><circle cx="780" cy="255" r="3"/><circle cx="930" cy="182" r="4"/><circle cx="1048" cy="232" r="4"/><circle cx="1176" cy="130" r="4"/><circle cx="1284" cy="174" r="3"/></g>
  <g fill="#84909d" font-family="ui-monospace,Consolas,monospace" font-size="11"><text x="760" y="279">data</text><text x="914" y="169">train</text><text x="1028" y="254">track</text><text x="1152" y="116">serve</text><text x="1260" y="196">monitor</text></g>

  <!-- terminal content -->
  <g font-family="ui-monospace,Consolas,monospace">
    <text x="90" y="122" fill="#62d5d2" font-size="16">&gt; whoami</text>
    <text x="90" y="150" fill="#f2e9dc" font-size="31" font-weight="700">Mitadru Mridha</text>
    <text x="90" y="177" fill="#dc143c" font-size="17">機械学習エンジニア志望 · ML ENGINEER IN TRAINING</text>
    <text x="90" y="218" fill="#8d99a7" font-size="14">[mission]  turn data into reliable, reproducible systems</text>
    <text x="90" y="245" fill="#8d99a7" font-size="14">[stack]    Python · scikit-learn · MLflow · DVC · Docker · FastAPI</text>
    <text x="90" y="272" fill="#8d99a7" font-size="14">[method]   learn → build → deploy → improve</text>
    <text x="90" y="305" fill="#d4af37" font-size="14">status: OPEN TO ML / MLOPS / SOFTWARE ENGINEERING</text>
    <rect x="90" y="316" width="9" height="16" fill="#dc143c"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
  </g>

  <!-- red seal and moving scanline -->
  <g transform="translate(1266 92)"><rect width="54" height="54" fill="#dc143c"/><rect x="5" y="5" width="44" height="44" fill="none" stroke="#f2e9dc" stroke-opacity=".65"/><text x="27" y="39" text-anchor="middle" fill="#f2e9dc" font-size="30" font-family="serif">侍</text></g>
  <rect x="48" y="90" width="3" height="238" fill="#dc143c" opacity=".55"><animate attributeName="x" values="48;1349;48" dur="7s" repeatCount="indefinite"/></rect>
  <rect x="48" y="43" width="1304" height="293" rx="10" fill="none" stroke="url(#edge)" stroke-opacity=".65"/>
</svg>
